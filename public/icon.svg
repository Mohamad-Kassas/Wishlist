<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7F6F2" />
    </linearGradient>
    <linearGradient id="facetShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.24)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
  </defs>

  <!-- Obsidian Canvas Squircle -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#0A0A0C" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Ambient Warm Amber Bloom -->
  <circle cx="16" cy="16" r="11" fill="url(#ambient)" />

  <!-- Diagonal Micro-Sparkles -->
  <circle cx="9.5" cy="9.5" r="0.8" fill="#F59E0B" opacity="0.8" />
  <circle cx="22.5" cy="9.5" r="0.8" fill="#F59E0B" opacity="0.8" />
  <circle cx="22.5" cy="22.5" r="0.8" fill="#F59E0B" opacity="0.8" />
  <circle cx="9.5" cy="22.5" r="0.8" fill="#F59E0B" opacity="0.8" />

  <!-- Faceted Curation Star (Light Half) -->
  <path d="M 16 5.5 C 16 11 11 16 5.5 16 C 11 16 16 21 16 26.5 Z" fill="url(#facetLight)" />

  <!-- Faceted Curation Star (Shaded Half) -->
  <path d="M 16 5.5 C 16 11 21 16 26.5 16 C 21 16 16 21 16 26.5 Z" fill="url(#facetShade)" />

  <!-- Center Warm Amber Core Facet -->
  <polygon points="16,13 19,16 16,19 13,16" fill="#F59E0B" />
</svg>